# Push a tag like v0.2.0 (after bumping `version` in Cargo.toml's [workspace.package]) to build
# installers for Windows, macOS and Linux, sign the update bundles, and publish a GitHub
# Release with latest.json for kall's auto-updater. Also pushes the server image to GHCR.
#
# Secrets: CARGO_PACKAGER_SIGN_PRIVATE_KEY (contents of kall-updater.key),
#          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD (only if the key has a password; leave it unset otherwise).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
            platform: windows-x86_64
          - os: macos-latest
            formats: app,dmg
            platform: darwin-aarch64
          - os: ubuntu-24.04
            formats: appimage,deb
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      # Baked into the client: where it looks for updates.
      KALL_RELEASES: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake nasm libasound2-dev libdbus-1-dev libx11-dev libxi-dev libxtst-dev \
            libxdo-dev libxcb1-dev libxrandr-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libclang-dev libgbm-dev libdrm-dev libegl-dev libfontconfig-dev libva-dev

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install nasm cmake pkgconf

      # Windows builds use FFmpeg for hardware video (NVENC, AMF, Quick Sync): BtbN's LGPL
      # shared build of the stable 9.0 branch. libclang (for the bindings) is preinstalled.
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip"
          7z x -y -offmpeg ffmpeg.zip > /dev/null
          echo "FFMPEG_DIR=$PWD/ffmpeg/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
          echo "KALL_FEATURES=--features ffmpeg" >> "$GITHUB_ENV"

      # macOS and Linux link a small static FFmpeg built from source (VideoToolbox / NVENC),
      # cached until scripts/build_ffmpeg.sh changes.
      - name: Cache FFmpeg (macOS, Linux)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}

      - name: FFmpeg (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f ~/ffmpeg-static/lib/pkgconfig/libavcodec.pc || bash scripts/build_ffmpeg.sh ~/ffmpeg-static
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg-static/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "KALL_FEATURES=--features ffmpeg-static" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      # Same key as ci.yml, whose runs on main keep it warm (a tag can't read another tag's cache).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client

      - name: Check the tag matches the version
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }

      - name: Build
        shell: bash
        run: cargo build --release -p kall $KALL_FEATURES

      # The installer carries FFmpeg's DLLs next to kall.exe (build.rs copied them there).
      - name: Bundle FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: python3 scripts/bundle_ffmpeg.py crates/client/Cargo.toml

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package and sign
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD || '' }}
        run: cargo packager --release -p kall -f ${{ matrix.formats }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: target/dist/*

  publish:
    needs: client
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Only the installers: the Docker job uploads its own build record too.
          pattern: dist-*
      - name: Write latest.json
        run: python3 scripts/latest_json.py artifacts "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" > latest.json
      # This version's CHANGELOG.md section goes first; GitHub's generated notes (PRs and the
      # compare link) follow it.
      - name: Changelog
        run: python3 scripts/changelog.py "${GITHUB_REF_NAME}" > notes.md
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
            artifacts/*/*
          body_path: notes.md
          generate_release_notes: true

  server-image:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-server:latest
