# Builds the client on every push to main that touches code, and runs the tests on Linux.
# It also keeps the Rust cache warm: GitHub only lets a release tag read caches saved on its
# own tag or on main, so without this every release would compile everything from scratch.
# The setup mirrors release.yml's client job (same toolchain, packages and cache key).
name: ci

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
      - "Dockerfile"
  # Run by hand on a branch to also get its Linux AppImage and .deb as downloads (for testing
  # on Linux before merging).
  workflow_dispatch:
    inputs:
      version:
        description: "Build the Linux test packages as this version (e.g. an older one, to test updating). Empty: the real version."
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      KALL_RELEASES: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake nasm libasound2-dev libdbus-1-dev libx11-dev libxi-dev libxtst-dev \
            libxdo-dev libxcb1-dev libxrandr-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libclang-dev libgbm-dev libdrm-dev libegl-dev libfontconfig-dev libva-dev

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install nasm cmake pkgconf

      # Windows builds use FFmpeg for hardware video (NVENC, AMF, Quick Sync): BtbN's LGPL
      # shared build of the stable 9.0 branch. libclang (for the bindings) is preinstalled.
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip"
          7z x -y -offmpeg ffmpeg.zip > /dev/null
          echo "FFMPEG_DIR=$PWD/ffmpeg/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
          echo "KALL_FEATURES=--features ffmpeg" >> "$GITHUB_ENV"

      # macOS and Linux link a small static FFmpeg built from source (VideoToolbox / NVENC),
      # cached until scripts/build_ffmpeg.sh changes.
      - name: Cache FFmpeg (macOS, Linux)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg-static
          key: ffmpeg-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}

      - name: FFmpeg (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f ~/ffmpeg-static/lib/pkgconfig/libavcodec.pc || bash scripts/build_ffmpeg.sh ~/ffmpeg-static
          echo "PKG_CONFIG_PATH=$HOME/ffmpeg-static/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "KALL_FEATURES=--features ffmpeg-static" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client

      - name: Test packages as another version
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: sed -i '0,/^version = ".*"/s//version = "${{ inputs.version }}"/' Cargo.toml

      - name: Build
        shell: bash
        run: cargo build --release -p kall $KALL_FEATURES

      # So the cached ~/.cargo/bin has it and releases don't compile it again.
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Test
        if: runner.os == 'Linux'
        # kall-hwaccel needs FFmpeg; it's built (and tested) through kall's ffmpeg features.
        run: cargo test --release --workspace --exclude kall-hwaccel

      # Unsigned test packages; they still check for updates like a release does.
      - name: Linux test packages
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        run: cargo packager --release -p kall -f appimage,deb

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch'
        with:
          name: kall-linux-test
          path: |
            target/dist/*.AppImage
            target/dist/*.deb
          retention-days: 14

  # The server's Docker image builds (not pushed): catches a broken Dockerfile before a release.
  server-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
