# Builds the client on every push to main that touches code, and runs the tests on Linux.
# It also keeps the Rust cache warm: GitHub only lets a release tag read caches saved on its
# own tag or on main, so without this every release would compile everything from scratch.
# The setup mirrors release.yml's client job (same toolchain, packages and cache key).
name: ci

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      KALL_RELEASES: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake nasm libasound2-dev libdbus-1-dev libx11-dev libxi-dev libxtst-dev \
            libxdo-dev libxcb1-dev libxrandr-dev libxkbcommon-dev libwayland-dev libpipewire-0.3-dev libclang-dev libgbm-dev libdrm-dev libegl-dev libfontconfig-dev

      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install nasm cmake

      # Windows builds use FFmpeg for hardware video (NVENC, AMF, Quick Sync): BtbN's LGPL
      # shared build of the stable 9.0 branch. libclang (for the bindings) is preinstalled.
      - name: FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip"
          7z x -y -offmpeg ffmpeg.zip > /dev/null
          echo "FFMPEG_DIR=$PWD/ffmpeg/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
          echo "KALL_FEATURES=--features ffmpeg" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: client

      - name: Build
        shell: bash
        run: cargo build --release -p kall $KALL_FEATURES

      # So the cached ~/.cargo/bin has it and releases don't compile it again.
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --release --workspace
