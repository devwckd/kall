[workspace]
resolver = "3"
members = ["crates/proto", "crates/server", "crates/client", "crates/hwaccel"]
default-members = ["crates/server", "crates/client"]

[workspace.package]
version = "0.3.1"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
kall-proto = { path = "crates/proto" }
rune = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
rune-notify = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
anyhow = "1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
naga = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "7a7ed14e93ef00782a6c7c9a672608a9ba778cdb" }

# Dependencies (codecs, DSP, capture) run optimized even in dev builds: unoptimized OpenH264,
# Opus and the echo canceller are far too slow for real-time media.
[profile.dev.package."*"]
opt-level = 3

# Our own per-pixel loops (scaling, colour conversion) too; debugging still works.
[profile.dev.package.kall]
opt-level = 2
