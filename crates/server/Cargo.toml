[package]
name = "kall-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
kall-proto.workspace = true
anyhow.workspace = true
quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
tokio.workspace = true
postcard.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
argon2 = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "hyper-rustls", "rcgen"] }
x509-parser = "0.18"
serde_json = "1.0.154"
serde = { workspace = true, features = ["derive"] }
bytes = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[dev-dependencies]
tempfile = "3"
kall-proto = { workspace = true, features = ["client"] }
wiremock = "0.6"
