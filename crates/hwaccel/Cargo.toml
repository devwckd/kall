[package]
name = "kall-hwaccel"
description = "kall's GPU video decoding and VAAPI encoding (FFmpeg's hardware APIs behind safe functions)"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
ffmpeg-next = { version = "9.1", default-features = false, features = ["codec", "format", "software-scaling"] }

[features]
# Link FFmpeg statically (macOS/Linux release builds), as the client's `ffmpeg-static`.
static = ["ffmpeg-next/static"]
