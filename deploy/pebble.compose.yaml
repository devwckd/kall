# Let's Encrypt's test CA plus a fake DNS server, for the ACME integration test:
#   docker compose -f deploy/pebble.compose.yaml up -d
#   cargo test -p kall-server --test acme_pebble -- --ignored
services:
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config test/config/pebble-config.json -dnsserver challtestsrv:8053
    environment:
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    ports: ["14000:14000"]
  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    command: -defaultIPv6 "" -defaultIPv4 127.0.0.1
    ports: ["8055:8055"]
