# kall on the home server. Put this file and your .env in one folder, then:  docker compose up -d
# To build the image from source instead, replace `image:` with `build: ..` (run from a checkout).
services:
  kall:
    image: ghcr.io/devwckd/kall-server:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "7744:7744/udp"
    volumes:
      - kall-data:/data

volumes:
  kall-data: {}
